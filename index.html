<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchsLive - Scores en Direct</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:80px}
header{background:#16a34a;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:24px} header p{font-size:12px;opacity:.9}
.tabs{display:flex;background:#1a1a1a;position:sticky;top:60px;z-index:9}
.tabs button{flex:1;padding:13px;border:none;background:transparent;color:#aaa;font-weight:bold;cursor:pointer}
.tabs button.active{color:#fff;border-bottom:3px solid #16a34a}
.section{display:none;padding:12px} .section.active{display:block}
.card{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:10px}
.league{color:#22c55e;font-size:11px;font-weight:bold;text-transform:uppercase}
.score-row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.team{font-weight:bold;font-size:15px;flex:1} .sc{font-size:22px;font-weight:bold;color:#22c55e;min-width:50px;text-align:center}
.status{text-align:center;font-size:11px;color:#fbbf24}
.live{color:#ef4444;font-weight:bold}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#2a2a2a;color:#fff;margin-bottom:8px}
button.send{width:100%;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.comment{background:#1e1e1e;border-radius:12px;padding:12px;margin-bottom:8px}
.comment b{color:#22c55e} .comment small{color:#888}
.news{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:10px}
.news h3{font-size:15px;margin-bottom:5px} .news p{font-size:13px;color:#ccc}
.refresh{text-align:center;padding:10px;color:#888;font-size:12px}
</style>
</head>
<body>
<header><h1>⚽ MatchsLive</h1><p>Scores en direct • Commentaires partagés • Togo & Monde</p></header>
<div class="tabs">
<button class="active" onclick="showTab('scores',this)">📊 Scores</button>
<button onclick="showTab('comments',this)">💬 Commentaires</button>
<button onclick="showTab('news',this)">📰 Actus</button>
</div>

<div id="scores" class="section active"><div class="refresh" id="lastUpdate">Chargement des matchs...</div><div id="matches"></div></div>

<div id="comments" class="section">
<div class="card"><h3>💬 Dis quelque chose, tout le monde va voir !</h3><br>
<input id="userName" placeholder="Ton nom (ex: Dodji)" maxlength="20">
<textarea id="commentText" rows="2" placeholder="Salut les gars, quel match !..." maxlength="200"></textarea>
<button class="send" onclick="sendComment()">Envoyer 🚀</button>
<p style="font-size:11px;color:#888;margin-top:6px;text-align:center">Commentaires publics - tout le monde voit ce que tu écris.</p></div>
<div id="commentsList"><p style="text-align:center;color:#888">Chargement des commentaires...</p></div>
</div>

<div id="news" class="section"><div id="newsList"></div></div>

<script>
const FIREBASE_URL = "https://matchslive-5e96f-default-rtdb.firebaseio.com/comments.json";

function showTab(id,btn){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active'); btn.classList.add('active');
if(id==='comments') loadComments();
}

// --- SCORES ---
async function loadScores(){
try{
let res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?limit=100');
let data = await res.json();
let html='';
let events = data.events || [];
if(events.length===0) html='<div class="card" style="text-align:center">Aucun match en ce moment.<br>Reviens plus tard !</div>';
events.slice(0,40).forEach(ev=>{
let comp = ev.competitions[0];
let home = comp.competitors.find(c=>c.homeAway==='home');
let away = comp.competitors.find(c=>c.homeAway==='away');
let status = comp.status.type.state;
let label = comp.status.type.shortDetail || '';
let isLive = status==='in';
html+=`<div class="card"><div class="league">${ev.leagues?ev.leagues[0].name:'Football'} ${isLive?'<span class="live">● LIVE</span>':''}</div>
<div class="score-row"><div class="team">${home.team.displayName}</div><div class="sc">${home.score||'0'} - ${away.score||'0'}</div><div class="team" style="text-align:right">${away.team.displayName}</div></div>
<div class="status">${label}</div></div>`;
});
document.getElementById('matches').innerHTML=html;
document.getElementById('lastUpdate').innerText='Mis à jour à '+new Date().toLocaleTimeString()+' • '+events.length+' matchs';
}catch(e){document.getElementById('matches').innerHTML='<div class="card">Connexion faible... Réessaie.</div>';}
}

// --- COMMENTAIRES PARTAGES AVEC FIREBASE ---
async function loadComments(){
try{
let res = await fetch(FIREBASE_URL);
let data = await res.json();
let list = document.getElementById('commentsList');
if(!data){list.innerHTML='<p style="text-align:center;color:#888">Aucun commentaire. Sois le premier ! 🔥</p>';return;}
let arr = Object.values(data).sort((a,b)=>b.time-a.time);
list.innerHTML = arr.slice(0,50).map(c=>`<div class="comment"><b>${escapeHtml(c.name||'Anonyme')}</b> <small>• ${new Date(c.time).toLocaleString()}</small><p style="margin-top:5px">${escapeHtml(c.text||'')}</p></div>`).join('');
}catch(e){document.getElementById('commentsList').innerHTML='<p style="text-align:center">Erreur de chargement.</p>';}
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function sendComment(){
let name=document.getElementById('userName').value.trim()||'Anonyme';
let text=document.getElementById('commentText').value.trim();
if(!text){alert('Écris quelque chose poto !');return;}
localStorage.setItem('ml_name',name);
let btn=document.querySelector('.send'); btn.innerText='Envoi...'; btn.disabled=true;
await fetch(FIREBASE_URL,{method:'POST',body:JSON.stringify({name:name,text:text,time:Date.now()})});
document.getElementById('commentText').value='';
btn.innerText='Envoyer 🚀'; btn.disabled=false;
loadComments();
alert('Envoyé ! Tout le monde va voir ton commentaire 🔥');
}

// --- ACTUS ---
function loadNews(){
let news=[
{title:"Mercato : Les gros transferts à suivre",text:"Les clubs européens bougent beaucoup. Reste branché pour les dernières rumeurs et officialisations."},
{title:"Togo : Les Éperviers préparent les prochains matchs",text:"Le Togo travaille pour revenir fort. Les supporters attendent une grande performance."},
{title:"Ligue des Champions : Que des chocs !",text:"Les plus grands clubs du monde s'affrontent. Qui va soulever le trophée cette année ?"},
{title:"CAN : La bataille s'annonce chaude",text:"Les équipes africaines se préparent pour la CAN. Le niveau est de plus en plus élevé."}
];
document.getElementById('newsList').innerHTML=news.map(n=>`<div class="news"><h3>${n.title}</h3><p>${n.text}</p></div>`).join('');
}

document.getElementById('userName').value = localStorage.getItem('ml_name')||'';
loadScores(); loadNews(); loadComments();
setInterval(loadScores,60000);
setInterval(loadComments,10000);
</script>
</body>
</html>
